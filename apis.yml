name: Jask Labs
description: >-
  Jask Labs (JASK) was a cybersecurity company that built an Autonomous Security
  Operations Center (ASOC) platform — applying machine learning and analytics on
  top of network and security telemetry to triage and prioritize security alerts
  and reduce SOC analyst workload. Backed by Battery Ventures among other
  investors, JASK was acquired by Sumo Logic in 2019 and folded into Sumo Logic's
  cloud SIEM / Cloud SOC offering. Jask Labs no longer operates as an independent
  company: its domains (jask.ai and jask.com) now permanently redirect (HTTP 301)
  to sumologic.com, and there is no standalone Jask Labs developer portal, API
  documentation, SDK, or live product surface to enrich. This profile is retained
  as a portfolio-lead stub with the acquisition recorded.
